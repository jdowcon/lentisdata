name: Testit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript-syntaksi
        run: |
          for file in src/*.mjs api/*.mjs; do node --check "$file"; done
      - name: Yksikkötestit
        run: node --test tests/*.test.mjs
