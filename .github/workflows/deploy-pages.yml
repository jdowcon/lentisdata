name: Julkaise GitHub Pagesiin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tarkista ennen julkaisua
        run: node --test tests/*.test.mjs
      - name: Kerää vain julkisen PWA:n tiedostot
        run: |
          mkdir -p public-site/src public-site/assets
          cp index.html styles.css sw.js manifest.webmanifest public-site/
          cp src/*.mjs public-site/src/
          cp assets/icon.svg public-site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - id: deployment
        uses: actions/deploy-pages@v4
